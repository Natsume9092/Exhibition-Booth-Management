name: exhibition_booth_management
description: Trade Show & Exhibition Booth Management App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_plugin_android_lifecycle: ^2.0.22

  # Routing
  go_router: ^12.1.3

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod: ^2.5.1

  # Network
  dio: ^5.4.3

  # Caching & Storage
  shared_preferences: ^2.3.0
  flutter_secure_storage: ^9.0.0

  # UI
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1

  # Utils
  uuid: ^4.4.0
  intl: ^0.19.0
  equatable: ^2.0.5

  # Firebase
  firebase_core: ^2.27.0
  cloud_firestore: ^4.17.0
  firebase_auth: ^4.19.0

  # Image
  image_picker: ^1.1.2

  # Fix win32 conflict
  win32: ^5.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/